<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLiftSquad — Competition Import</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="myliftsquad-import.css?v=2.5.87">
<script>
// Apply the opt-in theme before first paint to avoid a flash, and preload
// its fonts. Default (classic) theme is untouched when no preference is set.
try {
  if (localStorage.getItem('mls_theme') === 'neo') {
    document.documentElement.classList.add('theme-neo');
    var l = document.createElement('link');
    l.id = 'neo-fonts'; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap';
    document.head.appendChild(l);
  }
} catch (e) {}
</script>
</head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()" title="Switch to light mode" aria-label="Switch to light mode"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<div class="app-version" id="appVersion">v2.5.87</div>
<div class="wrap">
  <header>
    <div class="logo">My<span>Lift</span>Squad</div>
    <p>Import flights from LiftingCast or the IrishPF website</p>
  </header>
  <div id="app"></div>
</div>
<script src="myliftsquad-import.js?v=2.5.87"></script>
<div id="panel-overlay" class="panel-overlay" onclick="closePanel()"></div>
<div id="panel" class="panel">
  <div class="panel-handle"></div>
  <div id="panel-content"></div>
</div>
</body>
</html>
