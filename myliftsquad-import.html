<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLiftSquad — LiftingCast Import</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="myliftsquad-import.css">
</head>
<body>
<div class="app-version" id="appVersion">v__APP_VERSION__</div>
<div class="wrap">
  <header>
    <div class="logo">My<span>Lift</span>Squad</div>
    <p>Import flights from LiftingCast</p>
  </header>
  <div id="app"></div>
</div>
<script src="myliftsquad-import.js"></script>
<div id="panel-overlay" class="panel-overlay" onclick="closePanel()"></div>
<div id="panel" class="panel">
  <div class="panel-handle"></div>
  <div id="panel-content"></div>
</div>
<script>
// The version token above is replaced at deploy time by the GitHub Actions
// workflow (see .github/workflows/pages.yml). When viewing the raw file
// locally the token is still present, so show "dev" instead.
(function () {
  var el = document.getElementById('appVersion');
  if (el && el.textContent.indexOf('__APP_VERSION__') > -1) el.textContent = 'dev';
})();
</script>
</body>
</html>
