<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLiftSquad — LiftingCast Import</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #20243a;
  --border: #2a2d3e;
  --accent: #6c8fff;
  --accent-dim: rgba(108,143,255,0.12);
  --text: #e8eaf0;
  --text-muted: #8b8fa8;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --r: 12px;
  --rs: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;padding:36px 0 40px}
.logo{font-size:1.625rem;font-weight:700}
.logo span{color:var(--accent)}
header p{color:var(--text-muted);margin-top:6px;font-size:.9375rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px}
.card-title{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:16px}
label{display:block;font-size:.8125rem;color:var(--text-muted);margin-bottom:5px}
input[type=url],input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:10px 14px;font-size:.9375rem;outline:none;transition:border-color .18s}
input:focus{border-color:var(--accent)}
.hint{font-size:.8rem;color:var(--text-muted);margin-top:5px}
.fg{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 28px;border-radius:var(--rs);font-size:.9375rem;font-weight:600;border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-block{width:100%}
.meet-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:4px}
.meet-name{font-size:1.0625rem;font-weight:600}
.chip{display:inline-block;background:var(--accent-dim);color:var(--accent);border-radius:20px;padding:2px 11px;font-size:.8rem;font-weight:500}
.prog-wrap{margin-top:16px}
.prog-bg{background:var(--border);border-radius:99px;height:5px;overflow:hidden}
.prog-fill{background:var(--accent);height:100%;border-radius:99px;transition:width .25s}
.prog-label{font-size:.8rem;color:var(--text-muted);margin-top:5px}
.flight-section{margin-bottom:20px}
.flight-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.flight-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--accent-dim);color:var(--accent);border-radius:7px;font-weight:700;font-size:.9rem;flex-shrink:0}
.flight-title{font-weight:600}
.flight-count{color:var(--text-muted);font-size:.85rem}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;padding:9px 14px;color:var(--text-muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.slug{font-family:ui-monospace,monospace;font-size:.8125rem;color:var(--accent);text-decoration:none}
.slug:hover{text-decoration:underline}
.muted{color:var(--text-muted)}
.wclass{font-family:ui-monospace,monospace;font-size:.8125rem;color:var(--text)}
.total{font-family:ui-monospace,monospace;font-size:.8125rem;font-weight:600;color:var(--text)}
.bmanual{background:rgba(108,143,255,.14);color:var(--accent)}
.btn-add{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-size:.7rem;padding:2px 7px;cursor:pointer;margin-left:6px;vertical-align:middle;line-height:1.4}
.btn-add:hover{border-color:var(--accent);color:var(--accent)}
.edit-cell{padding:8px 14px !important}
.edit-row{display:flex;gap:6px;align-items:center}
.edit-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);border-radius:var(--rs);color:var(--text);padding:6px 10px;font-size:.8125rem;outline:none}
.btn-sm{padding:5px 12px;border-radius:var(--rs);font-size:.8125rem;font-weight:600;border:none;cursor:pointer;white-space:nowrap}
.btn-sm:disabled{opacity:.45;cursor:not-allowed}
.btn-sm-primary{background:var(--accent);color:#fff}
.btn-sm-ghost{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.lookup-err{color:var(--danger);font-size:.8rem;margin-top:4px}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--text)}
.th-active{color:var(--accent) !important}
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.bh{background:rgba(34,197,94,.14);color:#22c55e}
.bm{background:rgba(245,158,11,.14);color:#f59e0b}
.bl{background:rgba(239,68,68,.14);color:#ef4444}
.bn{background:var(--border);color:var(--text-muted)}
.bp{background:var(--border);color:var(--text-muted);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sum-row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
.sum-stat{display:flex;align-items:baseline;gap:6px}
.sum-num{font-size:1.75rem;font-weight:700}
.sum-label{color:var(--text-muted);font-size:.9rem}
.c-green{color:var(--success)}
.c-warn{color:var(--warning)}
.code-box{background:var(--bg);border:2px solid var(--accent);border-radius:var(--r);padding:28px 24px;text-align:center;margin-bottom:12px}
.code-val{font-size:2.75rem;font-weight:700;letter-spacing:.18em;color:var(--accent);font-family:ui-monospace,monospace}
.code-hint{color:var(--text-muted);font-size:.875rem;margin-top:8px}
.qr-wrap{display:flex;justify-content:center;margin:16px 0}
.multi-codes{display:flex;flex-direction:column;gap:10px}
.mc-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.mc-label{font-size:.875rem;color:var(--text-muted)}
.mc-val{font-family:ui-monospace,monospace;font-size:1.25rem;font-weight:700;color:var(--accent);letter-spacing:.1em}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--rs);padding:14px 16px;color:#ef4444;font-size:.9rem;margin-bottom:14px}
.squad-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.squad-card:hover{border-color:var(--accent)}
.squad-card:last-child{margin-bottom:0}
.squad-card-body{flex:1;min-width:0}
.squad-card-name{font-weight:600;font-size:.9375rem}
.squad-card-meta{color:var(--text-muted);font-size:.8rem;margin-top:2px}
.squad-card-code{color:var(--accent);font-family:ui-monospace,monospace;font-size:.8rem;margin-top:3px;letter-spacing:.05em;font-weight:600}
.squad-card-right{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:1rem;flex-shrink:0}
.squad-card-del{background:none;border:none;color:var(--text-muted);font-size:.9rem;cursor:pointer;padding:4px 6px;flex-shrink:0;line-height:1}
.squad-card-del:hover{color:var(--danger)}
.ath-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ath-card:last-child{margin-bottom:0}
.ath-body{flex:1;min-width:0}
.ath-name{font-weight:600;font-size:.9375rem}
.ath-meta{font-size:.8rem;margin-top:3px}
.ath-fed{color:var(--accent)}
.ath-sep{color:var(--text-muted)}
.ath-sec{color:var(--text-muted)}
.ath-sbd{font-size:.8rem;margin-top:4px}
.ath-sbd-l{color:var(--accent);font-weight:600}
.ath-sbd-v{color:var(--text-muted)}
.ath-total{background:var(--accent-dim);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:.8125rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.btn-save{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:6px 16px;font-size:.875rem;font-weight:600;cursor:pointer;transition:opacity .15s;margin-left:auto;flex-shrink:0}
.btn-save:hover{opacity:.85}
.btn-edit{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:var(--rs);padding:5px 14px;font-size:.8125rem;font-weight:600;cursor:pointer;margin-left:auto;flex-shrink:0}
.btn-edit:hover{border-color:var(--accent);color:var(--accent)}
.loading{text-align:center;padding:56px 24px;color:var(--text-muted)}
.spinner{display:inline-block;width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;gap:10px;align-items:center}
.btn-back{background:none;border:none;color:var(--text-muted);font-size:.9rem;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
.btn-back:hover{color:var(--text)}
@media(max-width:580px){
  .hide-sm{display:none}
  .sum-num{font-size:1.4rem}
}
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.panel-overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;background:var(--surface);z-index:101;overflow-y:auto;transition:transform .3s cubic-bezier(.32,1,.23,1);display:flex;flex-direction:column}
@media(min-width:600px){
  .panel{top:0;right:0;bottom:0;width:420px;border-left:1px solid var(--border);transform:translateX(105%)}
  .panel.open{transform:translateX(0)}
}
@media(max-width:599px){
  .panel{left:0;right:0;bottom:0;max-height:85vh;border-radius:16px 16px 0 0;border-top:1px solid var(--border);transform:translateY(100%)}
  .panel.open{transform:translateY(0)}
  .panel-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:12px auto 4px}
}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;gap:12px}
.panel-title{font-size:1.0625rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.panel-opl{color:var(--accent);font-size:.875rem;text-decoration:none;white-space:nowrap}
.panel-opl:hover{text-decoration:underline}
.panel-close{background:none;border:none;color:var(--text-muted);font-size:1.25rem;cursor:pointer;padding:2px 6px;line-height:1}
.panel-close:hover{color:var(--text)}
.panel-empty{padding:32px 20px;color:var(--text-muted);text-align:center}
.meet-row{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.meet-row:last-child{border-bottom:none}
.meet-row-body{flex:1;min-width:0}
.meet-row-name{font-weight:600;font-size:.875rem}
.meet-row-meta{color:var(--text-muted);font-size:.75rem;margin-top:2px}
.meet-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.meet-place{color:var(--text-muted);font-size:.75rem;font-weight:700;text-transform:uppercase}
.ath-card-clickable{cursor:pointer;transition:border-color .15s}
.ath-card-clickable:hover{border-color:var(--accent)}
.lifter-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lifter-list-header{display:flex;align-items:center;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);gap:8px}
.lifter-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.lifter-row:last-child{border-bottom:none}
.lifter-row-editing{align-items:flex-start}
.lifter-col-main{flex:1;min-width:0}
.lifter-col-right{flex-shrink:0;display:flex;align-items:center;gap:6px}
.lifter-row-name{font-size:.875rem}
.lifter-row-meta{font-size:.8rem;margin-top:3px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sort-btn{background:none;border:none;color:var(--text-muted);font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;padding:0;line-height:1}
.sort-btn:hover{color:var(--text)}
.sort-btn-active{color:var(--accent) !important}
.btn-share{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:var(--rs);padding:5px 14px;font-size:.8125rem;font-weight:600;cursor:pointer;flex-shrink:0}
.btn-share:hover{background:var(--accent);color:#fff}
.share-box{margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:center;gap:10px}
.share-url{flex:1;font-family:ui-monospace,monospace;font-size:.75rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btn-copy{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--rs);padding:5px 12px;font-size:.8rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.copied{border-color:var(--success);color:var(--success)}
.btn-dismiss{background:none;border:none;color:var(--text-muted);font-size:1rem;line-height:1;cursor:pointer;padding:4px 6px;flex-shrink:0;opacity:.6;transition:opacity .15s,color .15s}
.btn-dismiss:hover{opacity:1;color:var(--text)}
.chip-opl{background:rgba(251,54,64,.14);color:#fb3640}.chip-ipf{background:rgba(253,185,62,.16);color:#fdb93e}
/* Source toggle — heavier, pill style with glow on active */
.src-ctrl{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
.src-opt{padding:5px 13px;font-size:.8125rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);border-radius:99px;transition:background .18s,color .18s,box-shadow .18s;line-height:1.4;white-space:nowrap}
.src-opt:hover{color:var(--text)}
.src-opt.active{background:var(--accent);color:#fff;box-shadow:0 0 0 1px rgba(108,143,255,.4),0 2px 8px rgba(108,143,255,.25)}
/* Metric toggle — lighter, tab/underline style */
.metric-ctrl{display:inline-flex;gap:0;border-bottom:1px solid var(--border)}
.metric-opt{padding:5px 12px;font-size:.8125rem;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;line-height:1.4;white-space:nowrap}
.metric-opt:hover{color:var(--text)}
.metric-opt.active{color:var(--accent);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">My<span>Lift</span>Squad</div>
    <p>Import flights from LiftingCast</p>
  </header>
  <div id="app"></div>
</div>
<script>
var API = 'https://myliftsquad-web.gooseyirl.workers.dev';
var BUNDLE_API = 'https://myliftsquad-api.gooseyirl.workers.dev';
var HISTORY_KEY = 'mls_history';
var HISTORY_MAX = 5;
var oplSource = localStorage.getItem('mls_opl_source') || 'opl';

function setOplSource(src) {
  oplSource = src;
  try { localStorage.setItem('mls_opl_source', src); } catch(e) {}
  var oBtn = document.getElementById('src-opl');
  var iBtn = document.getElementById('src-ipf');
  if (oBtn) oBtn.classList.toggle('active', src === 'opl');
  if (iBtn) iBtn.classList.toggle('active', src === 'ipf');
}

function setMetric(m) {
  st.metric = m;
  render();
}

function oplProfileBase() {
  return oplSource === 'ipf' ? 'https://www.openipf.org/u' : 'https://www.openpowerlifting.org/u';
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; }
}

function saveToHistory() {
  if (!st.meet || !st.meetId) return;
  var history = getHistory().filter(function(h) { return h.meetId !== st.meetId; });
  history.unshift({ savedAt: new Date().toISOString(), meetId: st.meetId, lcUrl: st.lcUrl, nameOverride: st.nameOverride, meet: st.meet, lifters: st.lifters, resolved: st.resolved, bundleCodes: st.bundleCodes });
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_MAX))); } catch(e) {}
}

function loadFromHistory(meetId) {
  var history = getHistory();
  var entry = null;
  for (var i = 0; i < history.length; i++) { if (history[i].meetId === meetId) { entry = history[i]; break; } }
  if (!entry) return;
  st.phase = 'done';
  st.meetId = entry.meetId;
  st.lcUrl = entry.lcUrl;
  st.nameOverride = entry.nameOverride || '';
  st.meet = entry.meet;
  st.lifters = entry.lifters;
  st.resolved = entry.resolved;
  st.resolvedCount = entry.resolved.filter(Boolean).length;
  st.bundleCodes = entry.bundleCodes;
  st.editingIdx = -1;
  st.lookupError = null;
  st.genError = null;
  st.error = null;
  st.saved = true;
  render();
}

function deleteFromHistory(meetId) {
  var history = getHistory().filter(function(h) { return h.meetId !== meetId; });
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
  render();
}

function histFlightCount(lifters) {
  var f = {};
  for (var i = 0; i < lifters.length; i++) f[lifters[i].flight || '?'] = 1;
  return Object.keys(f).length;
}

var st = {
  phase: 'input',
  lcUrl: '',
  nameOverride: '',
  meetId: null,
  meet: null,
  lifters: [],
  resolved: [],
  resolvedCount: 0,
  editingIdx: -1,
  editingUrl: '',
  lookupError: null,
  sortCol: null,
  sortDir: 'asc',
  bundleCodes: null,
  genError: null,
  error: null,
  saved: false,
  panelSlug: null,
  panelName: '',
  panelData: null,
  panelLoading: false,
  panelError: null,
  shareCode: null,
  shareLoading: false,
  shareError: null,
  metric: 'total'
};

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function groupByFlight(lifters) {
  var g = {};
  for (var i = 0; i < lifters.length; i++) {
    var f = lifters[i].flight || '?';
    if (!g[f]) g[f] = [];
    g[f].push({lifter: lifters[i], idx: i});
  }
  return g;
}

function buildTableRows(entries) {
  var html = '';
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    var lifter = e.lifter;
    var r = st.resolved[e.idx];
    var isEditing = st.editingIdx === e.idx;

    html += '<div class="lifter-row' + (isEditing ? ' lifter-row-editing' : '') + '">';
    html += '<div class="lifter-col-main">';
    html += '<div class="lifter-row-name">' + esc(lifter.name) + '</div>';

    if (isEditing) {
      var curBclass = r && r.oplSlug ? (r.confidence === 'high' ? 'bh' : r.confidence === 'medium' ? 'bm' : r.confidence === 'manual' ? 'bmanual' : 'bl') : 'bn';
      var curBlabel = r && r.oplSlug ? (r.confidence === 'manual' ? 'Manual' : r.confidence) : 'None';
      html += '<div class="edit-row" style="margin-top:6px">';
      html += '<input type="url" id="eurl-' + e.idx + '" class="edit-input" placeholder="https://www.openpowerlifting.org/u/…" value="' + esc(st.editingUrl) + '">';
      html += '<button id="elookup-' + e.idx + '" class="btn-sm btn-sm-primary" onclick="doLookup(' + e.idx + ')">Lookup</button>';
      html += '<button class="btn-sm btn-sm-ghost" onclick="cancelEdit()" title="Cancel">✕</button>';
      html += '</div>';
      if (st.lookupError) html += '<p class="lookup-err">' + esc(st.lookupError) + '</p>';
      html += '</div>';
      html += '<div class="lifter-col-right"><span class="badge ' + curBclass + '">' + curBlabel + '</span></div>';
    } else if (!r) {
      html += '<div class="lifter-row-meta">';
      if (lifter.weightClass) html += '<span class="wclass">' + esc(lifter.weightClass) + '</span>';
      html += '</div>';
      html += '</div>';
      html += '<div class="lifter-col-right"><span class="badge bp">Resolving…</span></div>';
    } else if (r.oplSlug) {
      html += '<div class="lifter-row-meta">';
      if (lifter.weightClass) html += '<span class="wclass">' + esc(lifter.weightClass) + '</span><span class="muted"> → </span>';
      html += '<a class="slug" href="' + oplProfileBase() + '/' + esc(r.oplSlug) + '" target="_blank" rel="noopener">' + esc(r.oplSlug) + '</a>';
      if (r.oplWeightClass) html += '<span class="muted hide-sm"> · </span><span class="wclass hide-sm">' + esc(r.oplWeightClass) + '</span>';
      if (r.oplTotal) html += '<span class="muted hide-sm"> · </span><span class="total hide-sm">' + esc(r.oplTotal) + '</span>';
      html += '</div>';
      html += '</div>';
      var bclass2 = r.confidence === 'high' ? 'bh' : r.confidence === 'medium' ? 'bm' : r.confidence === 'manual' ? 'bmanual' : 'bl';
      var blabel2 = r.confidence === 'manual' ? 'Manual' : r.confidence;
      html += '<div class="lifter-col-right"><span class="badge ' + bclass2 + '">' + blabel2 + '</span><button class="btn-add" onclick="startEdit(' + e.idx + ')" title="Change match">✎</button></div>';
    } else {
      html += '<div class="lifter-row-meta">';
      if (lifter.weightClass) html += '<span class="wclass">' + esc(lifter.weightClass) + '</span>';
      html += '</div>';
      html += '</div>';
      html += '<div class="lifter-col-right"><span class="badge bn">None</span><button class="btn-add" onclick="startEdit(' + e.idx + ')">+ Add</button></div>';
    }

    html += '</div>';
  }
  return html;
}


function parseWc(s) {
  if (!s) return Infinity;
  var n = parseFloat(s);
  return isNaN(n) ? Infinity : n;
}

function setSort(col) {
  if (st.sortCol === col) {
    st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    st.sortCol = col;
    st.sortDir = 'asc';
  }
  render();
}

function sortEntries(entries) {
  if (!st.sortCol) return entries;
  var dir = st.sortDir === 'asc' ? 1 : -1;
  return entries.slice().sort(function(a, b) {
    if (st.sortCol === 'name') {
      return dir * a.lifter.name.localeCompare(b.lifter.name);
    }
    if (st.sortCol === 'class') {
      var wa = parseWc(a.lifter.weightClass), wb = parseWc(b.lifter.weightClass);
      if (wa !== wb) return dir * (wa - wb);
      return a.lifter.name.localeCompare(b.lifter.name);
    }
    return 0;
  });
}

function thSort(label, col) {
  var active = st.sortCol === col;
  var arrow = active ? (st.sortDir === 'asc' ? ' &#8593;' : ' &#8595;') : '';
  return '<button class="sort-btn' + (active ? ' sort-btn-active' : '') + '" onclick="setSort(\'' + col + '\')">' + label + arrow + '</button>';
}

function buildFlightsHTML() {
  var groups = groupByFlight(st.lifters);
  var flights = Object.keys(groups).sort();
  var html = '';
  for (var fi = 0; fi < flights.length; fi++) {
    var f = flights[fi];
    var entries = groups[f];
    html += '<div class="flight-section">';
    html += '<div class="flight-header">';
    html += '<span class="flight-badge">' + esc(f) + '</span>';
    html += '<span class="flight-title">Flight ' + esc(f) + '</span>';
    html += '<span class="flight-count">' + entries.length + ' athletes</span>';
    html += '</div>';
    html += '<div class="lifter-list">';
    html += '<div class="lifter-list-header">';
    html += '<div class="lifter-col-main">' + thSort('Lifter', 'name') + '<span style="opacity:.3;margin:0 8px">·</span>' + thSort('Class', 'class') + '</div>';
    html += '<div class="lifter-col-right" style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)">Confidence</div>';
    html += '</div>';
    html += buildTableRows(sortEntries(entries));
    html += '</div></div>';
  }
  return html;
}


function meetLabel() {
  if (st.nameOverride) return st.nameOverride;
  if (!st.meet) return '';
  return st.meet.federation + ' - ' + st.meet.date;
}

async function doShare() {
  st.shareLoading = true;
  st.shareError = null;
  st.shareCode = null;
  render();
  var state = {
    meetId: st.meetId, lcUrl: st.lcUrl, nameOverride: st.nameOverride,
    meet: st.meet, lifters: st.lifters, resolved: st.resolved, bundleCodes: st.bundleCodes
  };
  try {
    var res = await fetch(API + '/api/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: state })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Share failed');
    st.shareCode = data.code;
    st.shareLoading = false;
    render();
  } catch(err) {
    st.shareError = err.message || String(err);
    st.shareLoading = false;
    render();
  }
}

function copyShareUrl() {
  var url = shareUrl();
  if (!url) return;
  navigator.clipboard.writeText(url).then(function() {
    var btn = document.getElementById('copybtn');
    if (btn) { btn.textContent = 'Copied!'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000); }
  });
}

function shareUrl() {
  if (!st.shareCode) return '';
  return window.location.origin + window.location.pathname + '?share=' + st.shareCode;
}

async function loadFromShareCode(code) {
  st.phase = 'fetching';
  render();
  try {
    var res = await fetch(API + '/api/share?code=' + encodeURIComponent(code));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Share link not found');
    var s = data.state;
    st.phase = 'done';
    st.meetId = s.meetId || null;
    st.lcUrl = s.lcUrl || '';
    st.nameOverride = s.nameOverride || '';
    st.meet = s.meet;
    st.lifters = s.lifters;
    st.resolved = s.resolved;
    st.resolvedCount = (s.resolved || []).filter(Boolean).length;
    st.bundleCodes = s.bundleCodes || null;
    st.saved = true;
    st.shareCode = code;
    render();
  } catch(err) {
    st.phase = 'error';
    st.error = err.message || String(err);
    render();
  }
}

function formatPlace(p) {
  if (!p) return '';
  if (p === 'DQ' || p === 'NS' || p === 'DD' || p === 'G') return p;
  var n = parseInt(p);
  if (isNaN(n)) return p;
  return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
}

function openPanel(slug, name) {
  if (!slug) return;
  st.panelSlug = slug;
  st.panelName = name;
  st.panelData = null;
  st.panelLoading = true;
  st.panelError = null;
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderPanel();
  fetchPanelData(slug);
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  document.body.style.overflow = '';
}

async function fetchPanelData(slug) {
  try {
    var res = await fetch(API + '/api/lifter?slug=' + encodeURIComponent(slug) + '&source=' + oplSource);
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');
    st.panelData = data;
    st.panelLoading = false;
  } catch(err) {
    st.panelLoading = false;
    st.panelError = err.message || String(err);
  }
  renderPanel();
}

function renderPanel() {
  var el = document.getElementById('panel-content');
  if (!el) return;
  var html = '<div class="panel-header">';
  html += '<div class="panel-title">' + esc(st.panelName) + '</div>';
  html += '<div class="panel-header-actions">';
  if (st.panelSlug) html += '<a class="panel-opl" href="' + oplProfileBase() + '/' + esc(st.panelSlug) + '" target="_blank" rel="noopener">' + (oplSource === 'ipf' ? 'OpenIPF' : 'OpenPowerlifting') + ' &#8599;</a>';
  html += '<button class="panel-close" onclick="closePanel()">&#10005;</button>';
  html += '</div></div>';
  if (st.panelLoading) {
    html += '<div class="loading"><div class="spinner"></div></div>';
  } else if (st.panelError) {
    html += '<div class="err-box" style="margin:16px">' + esc(st.panelError) + '</div>';
  } else if (st.panelData) {
    var meets = st.panelData.meets;
    if (!meets || !meets.length) {
      html += '<p class="panel-empty">No competition history found.</p>';
    } else {
      for (var mi = 0; mi < meets.length; mi++) {
        var m = meets[mi];
        html += '<div class="meet-row"><div class="meet-row-body">';
        html += '<div class="meet-row-name">' + esc(m.meet || 'Unknown Meet') + '</div>';
        var meta = [];
        if (m.date) meta.push(m.date);
        if (m.federation) meta.push(m.federation);
        if (m.weightClass) meta.push(m.weightClass + ' kg');
        if (m.equipment) meta.push(m.equipment);
        if (meta.length) html += '<div class="meet-row-meta">' + esc(meta.join(' · ')) + '</div>';
        var sbd = [];
        if (m.squat && parseFloat(m.squat) > 0) sbd.push(['S', formatKg(m.squat)]);
        if (m.bench && parseFloat(m.bench) > 0) sbd.push(['B', formatKg(m.bench)]);
        if (m.deadlift && parseFloat(m.deadlift) > 0) sbd.push(['D', formatKg(m.deadlift)]);
        if (sbd.length) {
          html += '<div class="ath-sbd" style="margin-top:4px">';
          for (var si = 0; si < sbd.length; si++) {
            if (si > 0) html += '  ';
            html += '<span class="ath-sbd-l">' + sbd[si][0] + '</span><span class="ath-sbd-v"> ' + sbd[si][1] + '</span>';
          }
          html += '</div>';
        }
        html += '</div><div class="meet-row-right">';
        if (m.total && parseFloat(m.total) > 0) html += '<div class="ath-total">' + esc(formatKg(m.total)) + '</div>';
        if (m.place) html += '<div class="meet-place">' + esc(formatPlace(m.place)) + '</div>';
        html += '</div></div>';
      }
    }
  }
  el.innerHTML = html;
}

function formatKg(val) {
  if (!val) return '';
  var n = parseFloat(val);
  if (isNaN(n) || n <= 0) return '';
  return (n % 1 === 0 ? String(n) : String(n)) + ' kg';
}

function buildAthleteCard(lifter, r) {
  var clickable = r && r.oplSlug;
  var html = '<div class="ath-card' + (clickable ? ' ath-card-clickable' : '') + '"' +
    (clickable ? ' onclick="openPanel(\'' + esc(r.oplSlug) + '\',\'' + esc(lifter.name.replace(/'/g,'\\\'')) + '\')"' : '') + '>';
  html += '<div class="ath-body">';
  html += '<div class="ath-name">' + esc(lifter.name) + '</div>';
  if (r && r.oplSlug) {
    var wc = r.oplWeightClass || lifter.weightClass;
    var parts = [];
    if (r.oplFederation) parts.push('<span class="ath-fed">' + esc(r.oplFederation) + '</span>');
    if (wc) parts.push('<span class="ath-sec">' + esc(wc) + '</span>');
    if (r.oplEquipment) parts.push('<span class="ath-sec">' + esc(r.oplEquipment) + '</span>');
    if (parts.length) html += '<div class="ath-meta">' + parts.join('<span class="ath-sep"> - </span>') + '</div>';
    var sbd = [];
    if (r.oplSquat && parseFloat(r.oplSquat) > 0) sbd.push(['S', formatKg(r.oplSquat)]);
    if (r.oplBench && parseFloat(r.oplBench) > 0) sbd.push(['B', formatKg(r.oplBench)]);
    if (r.oplDeadlift && parseFloat(r.oplDeadlift) > 0) sbd.push(['D', formatKg(r.oplDeadlift)]);
    if (sbd.length) {
      html += '<div class="ath-sbd">';
      for (var si = 0; si < sbd.length; si++) {
        if (si > 0) html += '  ';
        html += '<span class="ath-sbd-l">' + sbd[si][0] + '</span><span class="ath-sbd-v"> ' + sbd[si][1] + '</span>';
      }
      html += '</div>';
    }
  } else {
    var wc2 = lifter.weightClass;
    if (wc2) html += '<div class="ath-meta"><span class="ath-sec">' + esc(wc2) + '</span></div>';
  }
  html += '</div>';
  if (r && r.oplSlug) {
    var dispVal = st.metric === 'gl' ? (r.oplGlPoints || '') : (r.oplTotal || '');
    var dispNum = parseFloat(dispVal);
    if (dispNum > 0) {
      html += '<div class="ath-total">' + esc(st.metric === 'gl' ? dispNum.toFixed(2) : formatKg(dispVal)) + '</div>';
    }
  }
  html += '</div>';
  return html;
}

function buildSquadView() {
  var groups = groupByFlight(st.lifters);
  var flights = Object.keys(groups).sort();
  var html = '';
  for (var fi = 0; fi < flights.length; fi++) {
    var f = flights[fi];
    var entries = sortEntries(groups[f]);
    html += '<div class="flight-section">';
    html += '<div class="flight-header">';
    html += '<span class="flight-badge">' + esc(f) + '</span>';
    html += '<span class="flight-title">Flight ' + esc(f) + '</span>';
    html += '<span class="flight-count">' + entries.length + ' athletes</span>';
    html += '</div>';
    for (var i = 0; i < entries.length; i++) {
      html += buildAthleteCard(entries[i].lifter, st.resolved[entries[i].idx]);
    }
    html += '</div>';
  }
  return html;
}

function doSave() {
  saveToHistory();
  st.saved = true;
  render();
}

function render() {
  var app = document.getElementById('app');
  if (!app) return;
  var html = '';

  if (st.phase === 'input') {
    html = '<div class="card">' +
      '<div class="card-title">LiftingCast Meet</div>' +
      '<div class="fg"><label for="lcu">LiftingCast URL</label>' +
      '<input type="url" id="lcu" placeholder="https://liftingcast.com/meets/…" value="' + esc(st.lcUrl) + '"></div>' +
      '<div class="fg"><label for="nom">Competition name <span style="opacity:.5">(optional)</span></label>' +
      '<input type="text" id="nom" placeholder="e.g. IrishPF 2026 June Open" value="' + esc(st.nameOverride) + '">' +
      '<p class="hint">Squad names will be prefixed with this. Defaults to federation + date from LiftingCast.</p></div>' +
      '<div class="fg"><label>Data Source</label>' +
      '<div class="src-ctrl">' +
      '<button class="src-opt' + (oplSource === 'opl' ? ' active' : '') + '" id="src-opl" data-src="opl" onclick="setOplSource(this.dataset.src)">OpenPowerlifting</button>' +
      '<button class="src-opt' + (oplSource === 'ipf' ? ' active' : '') + '" id="src-ipf" data-src="ipf" onclick="setOplSource(this.dataset.src)">OpenIPF</button>' +
      '</div>' +
      '<p class="hint">OpenIPF only includes IPF-affiliated competitions.</p></div>' +
      '<button class="btn btn-primary btn-block" onclick="doFetch()">Fetch Meet</button>' +
      '</div>';

    var hist = getHistory();
    if (hist.length > 0) {
      var PERSON_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>';
      html += '<div class="card"><div class="card-title">Saved Meets</div>';
      for (var hi = 0; hi < hist.length; hi++) {
        var h = hist[hi];
        var hname = h.nameOverride || (h.meet.federation + ' — ' + h.meet.date);
        var hflights = histFlightCount(h.lifters);
        var hdate = new Date(h.savedAt).toLocaleDateString(undefined, {day:'numeric',month:'short',year:'numeric'});
        html += '<div class="squad-card" onclick="loadFromHistory(\'' + esc(h.meetId) + '\')">';
        html += '<div class="squad-card-body">';
        html += '<div class="squad-card-name">' + esc(hname) + '</div>';
        html += '<div class="squad-card-meta">' + hflights + ' flight' + (hflights !== 1 ? 's' : '') + ' · saved ' + hdate + '</div>';
        if (h.bundleCodes) {
          var codes = h.bundleCodes.map(function(cc){return cc.code;}).join(', ');
          html += '<div class="squad-card-code">' + esc(codes) + '</div>';
        }
        html += '</div>';
        html += '<div class="squad-card-right">' + PERSON_ICON + '<span>' + h.lifters.length + '</span></div>';
        html += '<button class="squad-card-del" onclick="event.stopPropagation();deleteFromHistory(\'' + esc(h.meetId) + '\')" title="Remove">✕</button>';
        html += '</div>';
      }
      html += '</div>';
    }

  } else if (st.phase === 'fetching') {
    html = '<div class="loading"><div class="spinner"></div><br>Fetching meet data from LiftingCast…</div>';

  } else if (st.phase === 'resolving' || st.phase === 'done') {
    var meet = st.meet;
    html += '<div style="margin-bottom:12px"><button class="btn-back" onclick="doReset()">&#8592; Back</button></div>';
    html += '<div class="card">';
    html += '<div class="meet-meta">';
    html += '<span class="meet-name">' + esc(meet.name) + '</span>';
    html += '<span class="chip">' + esc(meet.federation) + '</span>';
    if (meet.date) html += '<span class="chip">' + esc(meet.date) + '</span>';
    html += '<span class="chip ' + (oplSource === 'ipf' ? 'chip-ipf' : 'chip-opl') + '">' + (oplSource === 'ipf' ? 'OpenIPF' : 'OpenPowerlifting') + '</span>';
    html += '<div class="metric-ctrl">' +
      '<button class="metric-opt' + (st.metric === 'total' ? ' active' : '') + '" onclick="setMetric(\'total\')">Total</button>' +
      '<button class="metric-opt' + (st.metric === 'gl' ? ' active' : '') + '" onclick="setMetric(\'gl\')">GL Points</button>' +
      '</div>';
    if (st.phase === 'done') {
      if (st.saved) {
        html += '<button class="btn-share" onclick="doShare()" ' + (st.shareLoading ? 'disabled' : '') + '>' + (st.shareLoading ? 'Sharing…' : 'Share') + '</button>';
        html += '<button class="btn-edit" onclick="st.saved=false;st.shareCode=null;render()">Edit</button>';
      } else {
        html += '<button class="btn-save" onclick="doSave()">Save</button>';
      }
    }
    html += '</div>';
    if (st.saved && st.shareCode) {
      var surl = shareUrl();
      html += '<div class="share-box">';
      html += '<span class="share-url">' + esc(surl) + '</span>';
      html += '<button id="copybtn" class="btn-copy" onclick="copyShareUrl()">Copy</button>';
      html += '<button class="btn-dismiss" onclick="st.shareCode=null;render()" title="Dismiss">&times;</button>';
      html += '</div>';
    }
    if (st.saved && st.shareError) {
      html += '<div class="err-box" style="margin-top:10px">' + esc(st.shareError) + '</div>';
    }
    if (st.phase === 'resolving') {
      var pct = st.lifters.length > 0 ? Math.round(st.resolvedCount / st.lifters.length * 100) : 0;
      html += '<div class="prog-wrap">';
      html += '<div class="prog-bg"><div class="prog-fill" style="width:' + pct + '%"></div></div>';
      html += '<p class="prog-label">Resolving ' + (oplSource === 'ipf' ? 'OpenIPF' : 'OpenPowerlifting') + ' slugs… ' + st.resolvedCount + ' / ' + st.lifters.length + '</p>';
      html += '</div>';
    } else {
      html += '<p class="hint" style="margin-top:8px">Squad prefix: <strong>' + esc(meetLabel()) + '</strong></p>';
    }
    html += '</div>';

    if (st.saved) {
      html += buildSquadView();
    } else {
      html += buildFlightsHTML();
    }

    if (st.phase === 'done') {
      if (st.bundleCodes) {
        html += '<div class="card">';
        html += '<div class="card-title">Import Code' + (st.bundleCodes.length > 1 ? 's' : '') + '</div>';
        if (st.bundleCodes.length === 1) {
          html += '<div class="code-box"><div class="code-val">' + esc(st.bundleCodes[0].code) + '</div>';
          html += '<div id="qr-' + esc(st.bundleCodes[0].code) + '" class="qr-wrap"></div>';
          html += '<p class="code-hint">Open MyLiftSquad &rarr; FAB &rarr; Import Squad &rarr; enter this code</p></div>';
        } else {
          html += '<div class="multi-codes">';
          for (var ci = 0; ci < st.bundleCodes.length; ci++) {
            var item = st.bundleCodes[ci];
            html += '<div class="mc-item">';
            html += '<span class="mc-label">Flights ' + esc(item.flights.join(', ')) + '</span>';
            html += '<span class="mc-val">' + esc(item.code) + '</span>';
            html += '<div id="qr-' + esc(item.code) + '" class="qr-wrap"></div>';
            html += '</div>';
          }
          html += '</div>';
        }
        html += '<p class="hint" style="margin-top:12px;text-align:center">Codes expire after 30 days.</p>';
        html += '</div>';
      } else if (!st.saved) {
        var matched = 0;
        for (var ri = 0; ri < st.resolved.length; ri++) {
          if (st.resolved[ri] && st.resolved[ri].oplSlug) matched++;
        }
        var unmatched = st.lifters.length - matched;
        html += '<div class="card">';
        html += '<div class="sum-row">';
        html += '<div class="sum-stat"><span class="sum-num c-green">' + matched + '</span><span class="sum-label">matched</span></div>';
        if (unmatched > 0) {
          html += '<div class="sum-stat"><span class="sum-num c-warn">' + unmatched + '</span><span class="sum-label">without OPL slug</span></div>';
        }
        html += '</div>';
        if (st.genError) html += '<div class="err-box">' + esc(st.genError) + '</div>';
        html += '<button class="btn btn-primary btn-block" id="genbtn" onclick="doGenerate()">Generate Import Code</button>';
        html += '</div>';
      }
    }

  } else if (st.phase === 'error') {
    html = '<div class="err-box">' + esc(st.error) + '</div>' +
      '<button class="btn btn-secondary" onclick="doReset()">Try again</button>';
  }

  app.innerHTML = html;

  if (st.bundleCodes && typeof QRCode !== 'undefined') {
    for (var qi = 0; qi < st.bundleCodes.length; qi++) {
      var qc = st.bundleCodes[qi].code;
      var qel = document.getElementById('qr-' + qc);
      if (qel && !qel.hasChildNodes()) {
        new QRCode(qel, { text: qc, width: 180, height: 180, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
      }
    }
  }

  if (st.phase === 'input') {
    var ui = document.getElementById('lcu');
    var ni = document.getElementById('nom');
    if (ui) {
      ui.addEventListener('input', function() { st.lcUrl = this.value; });
      ui.addEventListener('keydown', function(e) { if (e.key === 'Enter') doFetch(); });
    }
    if (ni) ni.addEventListener('input', function() { st.nameOverride = this.value; });
  }
}

function doReset() {
  st.phase = 'input';
  st.error = null;
  st.genError = null;
  st.bundleCodes = null;
  st.saved = false;
  render();
}

async function doFetch() {
  var ui = document.getElementById('lcu');
  var ni = document.getElementById('nom');
  if (ui) st.lcUrl = ui.value.trim();
  if (ni) st.nameOverride = ni.value.trim();
  if (!st.lcUrl) { alert('Please enter a LiftingCast URL'); return; }

  st.phase = 'fetching';
  st.error = null;
  st.genError = null;
  st.bundleCodes = null;
  render();

  try {
    var res = await fetch(API + '/api/meet?url=' + encodeURIComponent(st.lcUrl));
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

    st.meet = data.meet;
    st.meetId = data.meetId;
    st.lifters = data.lifters;
    st.resolved = new Array(data.lifters.length).fill(null);
    st.resolvedCount = 0;
    st.phase = 'resolving';
    render();

    await doResolveAll();
    st.phase = 'done';
    st.saved = false;
    render();
  } catch (err) {
    st.phase = 'error';
    st.error = err.message || String(err);
    render();
  }
}

async function doResolveAll() {
  var lifters = st.lifters;
  var BATCH = 5;
  for (var i = 0; i < lifters.length; i += BATCH) {
    var batch = lifters.slice(i, Math.min(i + BATCH, lifters.length));
    var baseIdx = i;
    var promises = batch.map(function(lifter, j) {
      var idx = baseIdx + j;
      var url = API + '/api/resolve?name=' + encodeURIComponent(lifter.name) + '&gender=' + encodeURIComponent(lifter.gender) + '&source=' + oplSource;
      return fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var best = d.results && d.results[0];
          return { idx: idx, oplName: best ? best.name : '', oplSlug: best ? best.slug : '', confidence: best ? best.confidence : 'none', oplWeightClass: best ? best.weightClass : '', oplTotal: best ? best.total : '', oplGlPoints: best ? (best.glPoints || '') : '', oplSquat: best ? best.squat : '', oplBench: best ? best.bench : '', oplDeadlift: best ? best.deadlift : '', oplFederation: best ? best.federation : '', oplEquipment: best ? best.equipment : '', dataSource: best && best.slug ? oplSource : '' };
        })
        .catch(function() {
          return { idx: idx, oplName: '', oplSlug: '', confidence: 'none', oplWeightClass: '', oplTotal: '', oplGlPoints: '', oplSquat: '', oplBench: '', oplDeadlift: '', oplFederation: '', oplEquipment: '', dataSource: '' };
        });
    });
    var results = await Promise.all(promises);
    for (var k = 0; k < results.length; k++) {
      st.resolved[results[k].idx] = results[k];
    }
    st.resolvedCount = Math.min(i + BATCH, lifters.length);
    render();
  }
}

function startEdit(idx) {
  var r = st.resolved[idx];
  st.editingIdx = idx;
  st.editingUrl = (r && r.oplSlug) ? oplProfileBase() + '/' + r.oplSlug : '';
  st.lookupError = null;
  render();
  setTimeout(function() {
    var el = document.getElementById('eurl-' + idx);
    if (el) { el.focus(); el.select(); }
  }, 0);
}

function cancelEdit() {
  st.editingIdx = -1;
  st.lookupError = null;
  render();
}

async function doLookup(idx) {
  var input = document.getElementById('eurl-' + idx);
  var raw = input ? input.value.trim() : '';
  if (!raw) { st.lookupError = 'Paste an OPL URL or slug first'; render(); return; }

  // Extract slug from URL or accept bare slug
  var slug = raw;
  var m = raw.match(/(?:openpowerlifting|openipf)\.org\/u\/([A-Za-z0-9]+)/i);
  if (m) slug = m[1];
  else if (!/^[A-Za-z0-9]+$/.test(raw)) {
    st.lookupError = 'Paste a profile URL or just the slug';
    render();
    return;
  }

  var btn = document.getElementById('elookup-' + idx);
  if (btn) btn.disabled = true;
  st.lookupError = null;
  render();

  try {
    var res = await fetch(API + '/api/lookup?slug=' + encodeURIComponent(slug.toLowerCase()) + '&source=' + oplSource);
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');
    st.resolved[idx] = {
      idx: idx,
      oplName: data.name || slug,
      oplSlug: slug.toLowerCase(),
      confidence: 'manual',
      oplWeightClass: data.weightClass || '',
      oplTotal: data.total || '',
      oplGlPoints: data.glPoints || '',
      oplSquat: data.squat || '',
      oplBench: data.bench || '',
      oplDeadlift: data.deadlift || '',
      oplFederation: data.federation || '',
      oplEquipment: data.equipment || '',
      dataSource: oplSource
    };
    st.editingIdx = -1;
    st.lookupError = null;
    st.saved = false;
    render();
  } catch (err) {
    st.lookupError = err.message || String(err);
    if (btn) btn.disabled = false;
    render();
  }
}

async function doGenerate() {
  var btn = document.getElementById('genbtn');
  if (btn) btn.disabled = true;
  st.genError = null;

  var label = meetLabel();
  var flightMap = {};
  for (var i = 0; i < st.lifters.length; i++) {
    var lifter = st.lifters[i];
    var r = st.resolved[i];
    var f = lifter.flight || '?';
    if (!flightMap[f]) flightMap[f] = [];
    var athlete = { name: lifter.name };
    if (r && r.oplSlug) athlete.slug = r.oplSlug;
    flightMap[f].push(athlete);
  }

  var flights = Object.keys(flightMap).sort();
  var MAX = 10;
  var bundles = [];
  for (var b = 0; b < flights.length; b += MAX) {
    var chunk = flights.slice(b, b + MAX);
    var squads = chunk.map(function(fl) {
      return { name: label + ' - Flight ' + fl, athletes: flightMap[fl] };
    });
    bundles.push({ flights: chunk, squads: squads });
  }

  try {
    var codes = [];
    for (var bi = 0; bi < bundles.length; bi++) {
      var bundle = bundles[bi];
      var res = await fetch(BUNDLE_API + '/bundles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ squads: bundle.squads })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      codes.push({ code: data.code, flights: bundle.flights });
    }
    st.bundleCodes = codes;
    st.saved = false;
    render();
  } catch (err) {
    st.genError = err.message || String(err);
    if (btn) btn.disabled = false;
    render();
  }
}

var _shareParam = new URLSearchParams(window.location.search).get('share');
if (_shareParam) {
  loadFromShareCode(_shareParam.trim().toUpperCase());
} else {
  render();
}
</script>

  <div id="panel-content"></div>
</div>
